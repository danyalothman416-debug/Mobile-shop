<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📱 دوکانی مۆبایل - موبایل ستۆر</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rabar_014:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #fff;
            min-height: 100vh;
        }
        
        /* پەردەی پشتەوە */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }
        
        .particle {
            position: absolute;
            background: radial-gradient(circle, #6366f1, transparent);
            border-radius: 50%;
            animation: float 6s infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.3; }
            50% { transform: translateY(-20px) scale(1.2); opacity: 0.6; }
        }
        
        /* هێدەری سەرەکی */
        .header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa);
            padding: 25px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 40px rgba(99, 102, 241, 0.3);
            border-bottom: 2px solid rgba(255,255,255,0.1);
        }
        
        .header h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #e0e7ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        
        .header p {
            color: #c7d2fe;
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .header .cart-icon {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid rgba(255,255,255,0.3);
            font-size: 1.8rem;
        }
        
        .header .cart-icon:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 30px rgba(255,255,255,0.5);
        }
        
        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 5px 10px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(239,68,68,0.5);
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }
        
        /* سێکشنی گەڕان */
        .search-box {
            max-width: 600px;
            margin: 30px auto;
            position: relative;
        }
        
        .search-box input {
            width: 100%;
            padding: 18px 30px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            font-size: 1.2rem;
            color: white;
            text-align: right;
            transition: all 0.3s;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
        }
        
        .search-box input::placeholder {
            color: rgba(255,255,255,0.6);
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #a78bfa;
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.4);
            background: rgba(255,255,255,0.15);
        }
        
        /* کەتێگۆرییەکان */
        .categories {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto 30px;
        }
        
        .cat-btn {
            padding: 12px 25px;
            border: 2px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            color: #e0e7ff;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .cat-btn:hover {
            background: rgba(99, 102, 241, 0.3);
            border-color: #6366f1;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(99,102,241,0.3);
        }
        
        .cat-btn.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-color: transparent;
            color: white;
            box-shadow: 0 10px 30px rgba(139,92,246,0.5);
        }
        
        /* گریدی بەرهەمەکان */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            padding: 20px;
            max-width: 1300px;
            margin: 0 auto;
        }
        
        .product-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            position: relative;
        }
        
        .product-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: 0.5s;
        }
        
        .product-card:hover::before {
            left: 100%;
        }
        
        .product-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 25px 60px rgba(99,102,241,0.4);
            border-color: rgba(167,139,250,0.5);
        }
        
        .product-image-container {
            position: relative;
            background: linear-gradient(135deg, rgba(99,102,241,0.1), rgba(139,92,246,0.1));
            padding: 30px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .product-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transition: transform 0.5s;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.5));
        }
        
        .product-card:hover .product-image {
            transform: scale(1.1) rotate(-3deg);
        }
        
        .product-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(245,158,11,0.3);
        }
        
        .product-info {
            padding: 25px;
            background: rgba(0,0,0,0.3);
        }
        
        .product-brand {
            color: #a78bfa;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .product-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #fff;
            line-height: 1.3;
        }
        
        .product-description {
            color: #c7d2fe;
            font-size: 0.95rem;
            margin-bottom: 18px;
            line-height: 1.7;
            opacity: 0.9;
        }
        
        .product-specs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        
        .product-specs span {
            background: rgba(99,102,241,0.2);
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px solid rgba(139,92,246,0.3);
            color: #e0e7ff;
            transition: all 0.3s;
        }
        
        .product-specs span:hover {
            background: rgba(139,92,246,0.4);
            border-color: #a78bfa;
        }
        
        .price-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
        }
        
        .price {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f59e0b, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .old-price {
            text-decoration: line-through;
            color: #ef4444;
            font-size: 1.2rem;
            opacity: 0.8;
        }
        
        .discount {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 5px 15px rgba(239,68,68,0.3);
        }
        
        .add-to-cart {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 8px 25px rgba(99,102,241,0.3);
        }
        
        .add-to-cart:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(139,92,246,0.5);
            background: linear-gradient(135deg, #8b5cf6, #a78bfa);
        }
        
        .add-to-cart.out-of-stock {
            background: linear-gradient(135deg, #4b5563, #6b7280);
            cursor: not-allowed;
            box-shadow: none;
        }
        
        /* مۆداڵی سەبەتە */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .cart-modal.active {
            display: flex;
        }
        
        .cart-content {
            background: rgba(30,27,75,0.95);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 650px;
            max-height: 85vh;
            overflow-y: auto;
            border: 1px solid rgba(167,139,250,0.3);
            box-shadow: 0 30px 80px rgba(99,102,241,0.4);
            animation: modalSlide 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes modalSlide {
            from {
                transform: translateY(100px) scale(0.9);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        
        .close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .close-btn:hover {
            background: rgba(239,68,68,0.3);
            border-color: #ef4444;
        }
        
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s;
        }
        
        .cart-item:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(167,139,250,0.3);
        }
        
        .remove-btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .remove-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(239,68,68,0.4);
        }
        
        .total {
            font-size: 2rem;
            font-weight: 800;
            text-align: left;
            color: #fbbf24;
            margin: 25px 0;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
        }
        
        .checkout-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(16,185,129,0.3);
            letter-spacing: 1px;
        }
        
        .checkout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(16,185,129,0.5);
        }
        
        /* دوگمەی واتساپ */
        .whatsapp-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(37,211,102,0.5);
            z-index: 500;
            text-decoration: none;
            transition: all 0.3s;
            animation: floatBtn 3s infinite;
        }
        
        @keyframes floatBtn {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .whatsapp-btn:hover {
            transform: scale(1.15);
            box-shadow: 0 15px 50px rgba(37,211,102,0.7);
        }
        
        /* نۆتیفیکەیشن */
        .notification {
            position: fixed;
            bottom: 40px;
            left: 40px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            padding: 18px 35px;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.1rem;
            display: none;
            z-index: 3000;
            box-shadow: 0 15px 40px rgba(16,185,129,0.4);
            animation: slideInLeft 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        @keyframes slideInLeft {
            from {
                transform: translateX(-300px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .notification.show {
            display: block;
        }
        
        /* فووەتەر */
        .footer {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            text-align: center;
            padding: 30px;
            margin-top: 60px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .footer p {
            color: #c7d2fe;
            margin: 8px 0;
            font-size: 1rem;
        }
    </style>
</head>
<body>

<!-- پەردەی پشتەوە -->
<div class="bg-particles">
    <div class="particle" style="width: 300px; height: 300px; top: 10%; left: 5%; animation-delay: 0s;"></div>
    <div class="particle" style="width: 200px; height: 200px; top: 60%; right: 10%; animation-delay: 2s;"></div>
    <div class="particle" style="width: 250px; height: 250px; bottom: 20%; left: 20%; animation-delay: 4s;"></div>
</div>

<!-- هێدەر -->
<div class="header">
    <h1>📱 موبایل ستۆر</h1>
    <p>نوێترین مۆبایلەکان بە باشترین نرخ لە کوردستان</p>
    <div class="cart-icon" onclick="toggleCart()">
        🛒
        <span class="cart-count" id="cartCount">0</span>
    </div>
</div>

<!-- گەڕان -->
<div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 گەڕان بەدوای مۆبایلی خەونەکانت..." onkeyup="filterProducts()">
</div>

<!-- کەتێگۆرییەکان -->
<div class="categories">
    <button class="cat-btn active" onclick="filterByCategory('all', this)">🎯 هەموو</button>
    <button class="cat-btn" onclick="filterByCategory('iphone', this)">🍎 ئایفۆن</button>
    <button class="cat-btn" onclick="filterByCategory('samsung', this)">⭐ سامسونگ</button>
    <button class="cat-btn" onclick="filterByCategory('xiaomi', this)">🚀 شیاومی</button>
    <button class="cat-btn" onclick="filterByCategory('google', this)">🤖 گوگڵ</button>
    <button class="cat-btn" onclick="filterByCategory('oneplus', this)">⚡ وەن پڵەس</button>
    <button class="cat-btn" onclick="filterByCategory('huawei', this)">🌺 هواوی</button>
</div>

<!-- بەرهەمەکان -->
<div class="products-grid" id="productsGrid"></div>

<!-- مۆدالی سەبەتە -->
<div class="cart-modal" id="cartModal">
    <div class="cart-content" style="position: relative;">
        <button class="close-btn" onclick="toggleCart()">✕</button>
        <h2 style="text-align: center; margin-bottom: 30px; font-size: 2rem; background: linear-gradient(135deg, #fbbf24, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">🛒 سەبەتەی کڕین</h2>
        <div id="cartItems"></div>
        <div class="total" id="cartTotal">کۆی گشتی: 0 د.ع</div>
        <button class="checkout-btn" onclick="openCheckout()">📦 تەواوکردنی داواکاری</button>
    </div>
</div>

<!-- فۆرمی داواکاری -->
<div class="form-modal" id="checkoutModal">
    <div class="form-content">
        <h2 style="text-align: center; margin-bottom: 20px; color: #333;">📝 زانیاری داواکاری</h2>
        <form onsubmit="submitOrder(event)">
            <label>👤 ناوی تەواو</label>
            <input type="text" id="customerName" required placeholder="ناوی خۆت بنووسە">
            
            <label>📱 ژمارەی تەلەفۆن</label>
            <input type="tel" id="customerPhone" required placeholder="0770-XXX-XXXX">
            
            <label>🏙️ شار</label>
            <select id="customerCity" required>
                <option value="">شار هەڵبژێرە</option>
                <option>سلێمانی</option>
                <option>هەولێر</option>
                <option>دهۆک</option>
                <option>کەرکوک</option>
                <option>بەغداد</option>
            </select>
            
            <label>📍 ناونیشان</label>
            <textarea id="customerAddress" required placeholder="ناونیشانی تەواوت بنووسە" rows="3"></textarea>
            
            <button type="submit" class="checkout-btn" style="margin-top: 20px;">✅ تەواوکردنی داواکاری</button>
            <button type="button" class="remove-btn" style="margin-top: 10px; width: 100%;" onclick="closeCheckout()">🔙 گەڕانەوە</button>
        </form>
    </div>
</div>

<!-- نۆتیفیکەیشن -->
<div class="notification" id="notification"></div>

<!-- دوگمەی واتساپ -->
<a href="https://wa.me/9647701234567" target="_blank" class="whatsapp-btn" title="پەیوەندیمان پێوەبکە">
    💬
</a>

<!-- فووەتەر -->
<div class="footer">
    <p style="font-size: 1.2rem; font-weight: bold;">© 2024 موبایل ستۆر - هەموو مافەکان پارێزراون</p>
    <p>📞 0770-123-4567 | 📧 info@mobilestore.com</p>
    <p>دروستکراوە بە ❤️ لە کوردستان</p>
</div>

<script>

        image: 'https://fdn2.gsmarena.com/vv/pics/samsung/samsung-galaxy-s24-ultra-1.jpg',

    },
    {

        oldPrice: 950000,

// سەبەتەی کڕین
let cart = [];
let currentCategory = 'all';

// نیشاندانی بەرهەمەکان
function displayProducts(productsToShow) {
    const grid = document.getElementById('productsGrid');
    grid.innerHTML = '';
    
    productsToShow.forEach(product => {
        const discount = product.oldPrice ? Math.round((1 - product.price/product.oldPrice) * 100) : 0;
        
        grid.innerHTML += `
            <div class="product-card">
                <div class="product-image-container">
                    ${discount > 0 ? `<div class="product-badge">🔥 -${discount}%</div>` : ''}
                    <img src="${product.image}" alt="${product.name}" class="product-image" 
                         onerror="this.src='https://via.placeholder.com/300x300?text=No+Image'">
                </div>
                <div class="product-info">
                    <div class="product-brand">⭐ ${product.brand}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-description">${product.description}</div>
                    <div class="product-specs">
                        ${product.specs.map(spec => `<span>${spec}</span>`).join('')}
                    </div>
                    <div class="price-section">
                        <div>
                            ${product.oldPrice ? `<span class="old-price">${product.oldPrice.toLocaleString()} د.ع</span>` : ''}
                            <span class="price">${product.price.toLocaleString()} د.ع</span>
                        </div>
                        ${discount > 0 ? `<span class="discount">-${discount}%</span>` : ''}
                    </div>
                    <button class="add-to-cart ${product.stock === 0 ? 'out-of-stock' : ''}" 
                            ${product.stock === 0 ? 'disabled' : ''}
                            onclick="addToCart(${product.id})">
                        ${product.stock > 0 ? '🛒 زیادکردن بۆ سەبەتە' : '❌ تەواو بووە'}
                    </button>
                </div>
            </div>
        `;
    });
}

// فلتیەر بە کەتێگۆری
function filterByCategory(category, btn) {
    currentCategory = category;
    
    // چالاککردنی دوگمە
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    filterProducts();
}

// گەڕان و فلتیەر
function filterProducts() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    
    let filtered = products;
    
    if (currentCategory !== 'all') {
        filtered = filtered.filter(p => p.category === currentCategory);
    }
    
    if (searchTerm) {
        filtered = filtered.filter(p => 
            p.name.toLowerCase().includes(searchTerm) ||
            p.brand.toLowerCase().includes(searchTerm) ||
            p.description.toLowerCase().includes(searchTerm)
        );
    }
    
    displayProducts(filtered);
}

// زیادکردن بۆ سەبەتە
function addToCart(productId) {
    const product = products.find(p => p.id === productId);
    
    const existingItem = cart.find(item => item.id === productId);
    if (existingItem) {
        existingItem.quantity++;
    } else {
        cart.push({...product, quantity: 1});
    }
    
    updateCartCount();
    showNotification(`${product.name} زیادکرا بۆ سەبەتە ✅`);
}

// نوێکردنەوەی ژمارەی سەبەتە
function updateCartCount() {
    const count = cart.reduce((total, item) => total + item.quantity, 0);
    document.getElementById('cartCount').textContent = count;
}

// کردنەوە و داخستنی سەبەتە
function toggleCart() {
    const modal = document.getElementById('cartModal');
    modal.classList.toggle('active');
    displayCartItems();
}

// نیشاندانی ناوەڕۆکی سەبەتە
function displayCartItems() {
    const cartItems = document.getElementById('cartItems');
    
    if (cart.length === 0) {
        cartItems.innerHTML = '<p style="text-align: center; padding: 40px; color: #c7d2fe; font-size: 1.2rem;">🛒 سەبەتەکەت بەتاڵە</p>';
        document.getElementById('cartTotal').textContent = 'کۆی گشتی: 0 د.ع';
        return;
    }
    
    let html = '';
    let total = 0;
    
    cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        
        html += `
            <div class="cart-item">
                <div>
                    <strong style="color: #fff; font-size: 1.1rem;">${item.name}</strong><br>
                    <small style="color: #a78bfa;">${item.quantity} x ${item.price.toLocaleString()} د.ع</small>
                </div>
                <div style="text-align: left;">
                    <strong style="color: #fbbf24; font-size: 1.2rem;">${itemTotal.toLocaleString()} د.ع</strong>
                    <button class="remove-btn" onclick="removeFromCart(${item.id})">🗑️ سڕینەوە</button>
                </div>
            </div>
        `;
    });
    
    cartItems.innerHTML = html;
    document.getElementById('cartTotal').textContent = `کۆی گشتی: ${total.toLocaleString()} د.ع`;
}

// سڕینەوە لە سەبەتە
function removeFromCart(productId) {
    cart = cart.filter(item => item.id !== productId);
    updateCartCount();
    displayCartItems();
}

// فۆرمی داواکاری
function openCheckout() {
    if (cart.length === 0) {
        showNotification('⚠️ سەبەتەکەت بەتاڵە!');
        return;
    }
    document.getElementById('cartModal').classList.remove('active');
    document.getElementById('checkoutModal').classList.add('active');
}

function closeCheckout() {
    document.getElementById('checkoutModal').classList.remove('active');
}

// ناردنی داواکاری
function submitOrder(event) {
    event.preventDefault();
    
    const name = document.getElementById('customerName').value;
    const phone = document.getElementById('customerPhone').value;
    const city = document.getElementById('customerCity').value;
    const address = document.getElementById('customerAddress').value;
    
    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    
    // دروستکردنی پەیامی واتساپ
    let message = `📱 داواکاری نوێ%0A%0A`;
    message += `👤 ناو: ${name}%0A`;
    message += `📱 تەلەفۆن: ${phone}%0A`;
    message += `📍 ناونیشان: ${address}، ${city}%0A%0A`;
    message += `🛒 بەرهەمەکان:%0A`;
    
    cart.forEach(item => {
        message += `- ${item.name} (${item.quantity}x)%0A`;
    });
    
    message += `%0A💰 کۆی گشتی: ${total.toLocaleString()} د.ع`;
    
    // کردنەوەی واتساپ
    const whatsappNumber = '9647701234567';
    window.open(`https://wa.me/${whatsappNumber}?text=${message}`, '_blank');
    
    // سڕینەوەی سەبەتە
    cart = [];
    updateCartCount();
    document.getElementById('checkoutModal').classList.remove('active');
    
    showNotification('✅ داواکاریت بە سەرکەوتوویی تۆمارکرا! لە واتساپ پەیوەندیت پێوە دەکەین');
    
    // ڕیستارتکردنی فۆرم
    document.getElementById('customerName').value = '';
    document.getElementById('customerPhone').value = '';
    document.getElementById('customerCity').value = '';
    document.getElementById('customerAddress').value = '';
}

// نۆتیفیکەیشن
function showNotification(message) {
    const notification = document.getElementById('notification');
    notification.textContent = message;
    notification.classList.add('show');
    
    setTimeout(() => {
        notification.classList.remove('show');
    }, 3000);
}

// دەستپێکردن
displayProducts(products);
updateCartCount();
</script>
